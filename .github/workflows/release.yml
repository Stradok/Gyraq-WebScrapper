name: Release

# Push a tag like v0.2.0 to publish a release:
#   - a Docker image to ghcr.io (servers pull this automatically)
#   - desktop installers (Windows / macOS / Linux) attached to the GitHub Release,
#     which installed apps auto-update from
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.ref_name }}

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Version from tag
        working-directory: electron
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Bundle uv (Linux)
        if: runner.os == 'Linux'
        working-directory: electron/resources/uv
        run: |
          curl -fsSL https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-unknown-linux-gnu.tar.gz | tar xz --strip-components=1

      - name: Bundle uv (Windows)
        if: runner.os == 'Windows'
        working-directory: electron/resources/uv
        run: |
          curl -fsSL -o uv.zip https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-pc-windows-msvc.zip
          unzip -o uv.zip && rm uv.zip

      - name: Bundle uv (macOS universal)
        if: runner.os == 'macOS'
        working-directory: electron/resources/uv
        run: |
          for arch in aarch64 x86_64; do
            mkdir "t-$arch"
            curl -fsSL "https://github.com/astral-sh/uv/releases/latest/download/uv-$arch-apple-darwin.tar.gz" | tar xz --strip-components=1 -C "t-$arch"
          done
          lipo -create t-aarch64/uv t-x86_64/uv -output uv
          rm -rf t-aarch64 t-x86_64

      - name: Install
        working-directory: electron
        run: npm install

      - name: Build and publish
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional macOS signing/notarization - see README. Unsigned builds still work.
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            [ -z "$CSC_LINK" ] && export CSC_IDENTITY_AUTO_DISCOVERY=false
            npx electron-builder --mac --universal --publish always
          else
            npx electron-builder --publish always
          fi

  android:
    # Monitor-only Android app (a WebView over your own server). Attached to
    # the release after the desktop jobs create it.
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate Android project
        working-directory: mobile
        run: |
          npm install
          npx cap add android
          # Camera for scanning the server's pairing QR code.
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application|' android/app/src/main/AndroidManifest.xml
          # The server is usually plain http on a LAN address.
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"1.0\"/versionName \"${VERSION}\"/" android/app/build.gradle
          npx cap sync android

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
            PASS="$KEYSTORE_PASS"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret - signing with a throwaway key. Phones can't update over an APK signed with a different key."
            PASS=throwaway
            keytool -genkeypair -keystore release.keystore -alias gyraq -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Gyraq"
          fi
          UNSIGNED=$(ls mobile/android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-key-alias gyraq --ks-pass "pass:$PASS" \
            --out "Gyraq-Monitor-${GITHUB_REF_NAME#v}.apk" aligned.apk

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "Gyraq-Monitor-${GITHUB_REF_NAME#v}.apk" --clobber
